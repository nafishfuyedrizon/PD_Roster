openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: roster
    description: Shift roster operations
  - name: ems
    description: EMS duty hour operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /roster:
    get:
      operationId: listOfficers
      tags: [roster]
      summary: List all officers
      parameters:
        - name: department
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: weekPeriod
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of officers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Officer"
    post:
      operationId: createOfficer
      tags: [roster]
      summary: Add a new officer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOfficerBody"
      responses:
        "201":
          description: Officer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Officer"

  /roster/stats:
    get:
      operationId: getRosterStats
      tags: [roster]
      summary: Get roster statistics
      parameters:
        - name: weekPeriod
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Roster statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterStats"

  /roster/fto-pairs:
    get:
      operationId: getFtoPairs
      tags: [roster]
      summary: Get FTO-trainee pairings
      parameters:
        - name: weekPeriod
          in: query
          schema:
            type: string
      responses:
        "200":
          description: FTO pairings grouped by FTO
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FtoPairing"

  /roster/week-periods:
    get:
      operationId: listWeekPeriods
      tags: [roster]
      summary: List all available week periods
      responses:
        "200":
          description: List of week periods
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /roster/{id}:
    get:
      operationId: getOfficer
      tags: [roster]
      summary: Get a single officer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Officer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Officer"
        "404":
          description: Officer not found
    put:
      operationId: updateOfficer
      tags: [roster]
      summary: Update an officer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOfficerBody"
      responses:
        "200":
          description: Officer updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Officer"
    delete:
      operationId: deleteOfficer
      tags: [roster]
      summary: Delete an officer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Officer deleted

  /ems/duty-logs:
    get:
      operationId: listEmsDutyLogs
      tags: [ems]
      summary: List EMS duty logs
      parameters:
        - name: weekPeriod
          in: query
          schema:
            type: string
        - name: shiftType
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of EMS duty logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmsDutyLog"
    post:
      operationId: createEmsDutyLog
      tags: [ems]
      summary: Create EMS duty log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmsDutyLogBody"
      responses:
        "201":
          description: EMS duty log created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmsDutyLog"

  /ems/stats:
    get:
      operationId: getEmsStats
      tags: [ems]
      summary: Get EMS statistics
      parameters:
        - name: weekPeriod
          in: query
          schema:
            type: string
        - name: shiftType
          in: query
          schema:
            type: string
      responses:
        "200":
          description: EMS statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmsStats"

  /ems/breakdown:
    get:
      operationId: getEmsBreakdown
      tags: [ems]
      summary: Get weekly duty hour breakdown per personnel
      parameters:
        - name: shiftType
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Per-person weekly breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmsPersonnelWeekly"

  /ems/week-periods:
    get:
      operationId: listEmsWeekPeriods
      tags: [ems]
      summary: List all EMS week periods
      responses:
        "200":
          description: List of week periods
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /ems/duty-logs/{id}:
    put:
      operationId: updateEmsDutyLog
      tags: [ems]
      summary: Update EMS duty log
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmsDutyLogBody"
      responses:
        "200":
          description: EMS duty log updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmsDutyLog"
    delete:
      operationId: deleteEmsDutyLog
      tags: [ems]
      summary: Delete EMS duty log
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: EMS duty log deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Officer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        discordId:
          type: string
        rank:
          type: string
        department:
          type: string
        status:
          type: string
        dutyHours:
          type: string
          nullable: true
        completionStatus:
          type: string
          nullable: true
        appointedFto:
          type: string
          nullable: true
        weekPeriod:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - discordId
        - rank
        - department
        - status
        - weekPeriod
        - createdAt

    CreateOfficerBody:
      type: object
      properties:
        name:
          type: string
        discordId:
          type: string
        rank:
          type: string
        department:
          type: string
        status:
          type: string
        dutyHours:
          type: string
          nullable: true
        completionStatus:
          type: string
          nullable: true
        appointedFto:
          type: string
          nullable: true
        weekPeriod:
          type: string
      required:
        - name
        - discordId
        - rank
        - department
        - status
        - weekPeriod

    UpdateOfficerBody:
      type: object
      properties:
        name:
          type: string
        discordId:
          type: string
        rank:
          type: string
        department:
          type: string
        status:
          type: string
        dutyHours:
          type: string
          nullable: true
        completionStatus:
          type: string
          nullable: true
        appointedFto:
          type: string
          nullable: true
        weekPeriod:
          type: string

    RosterStats:
      type: object
      properties:
        totalOfficers:
          type: integer
        activeOfficers:
          type: integer
        loaOfficers:
          type: integer
        departmentBreakdown:
          type: array
          items:
            type: object
            properties:
              department:
                type: string
              count:
                type: integer
            required:
              - department
              - count
        rankBreakdown:
          type: array
          items:
            type: object
            properties:
              rank:
                type: string
              count:
                type: integer
            required:
              - rank
              - count
        topDutyHours:
          type: array
          items:
            $ref: "#/components/schemas/Officer"
        weekPeriod:
          type: string
      required:
        - totalOfficers
        - activeOfficers
        - loaOfficers
        - departmentBreakdown
        - rankBreakdown
        - topDutyHours
        - weekPeriod

    FtoPairing:
      type: object
      properties:
        ftoName:
          type: string
        trainees:
          type: array
          items:
            $ref: "#/components/schemas/Officer"
      required:
        - ftoName
        - trainees

    EmsDutyLog:
      type: object
      properties:
        id:
          type: integer
        csNumber:
          type: string
        name:
          type: string
        status:
          type: string
        rank:
          type: string
        weekPeriod:
          type: string
        dutyHours:
          type: string
          nullable: true
        shiftType:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - csNumber
        - name
        - status
        - rank
        - weekPeriod
        - shiftType
        - createdAt

    CreateEmsDutyLogBody:
      type: object
      properties:
        csNumber:
          type: string
        name:
          type: string
        status:
          type: string
        rank:
          type: string
        weekPeriod:
          type: string
        dutyHours:
          type: string
          nullable: true
        shiftType:
          type: string
      required:
        - csNumber
        - name
        - status
        - rank
        - weekPeriod
        - shiftType

    UpdateEmsDutyLogBody:
      type: object
      properties:
        csNumber:
          type: string
        name:
          type: string
        status:
          type: string
        rank:
          type: string
        weekPeriod:
          type: string
        dutyHours:
          type: string
          nullable: true
        shiftType:
          type: string

    EmsPersonnelWeekly:
      type: object
      properties:
        csNumber:
          type: string
        name:
          type: string
        status:
          type: string
        rank:
          type: string
        weeks:
          type: array
          items:
            type: object
            properties:
              weekPeriod:
                type: string
              dutyHours:
                type: string
                nullable: true
            required:
              - weekPeriod
        totalHours:
          type: string
      required:
        - csNumber
        - name
        - status
        - rank
        - weeks
        - totalHours

    EmsTopPerformer:
      type: object
      properties:
        csNumber:
          type: string
        name:
          type: string
        rank:
          type: string
        totalHours:
          type: string
        position:
          type: integer
      required:
        - csNumber
        - name
        - rank
        - totalHours
        - position

    EmsStats:
      type: object
      properties:
        activePersonnel:
          type: integer
        monthlyTotal:
          type: string
        weeklyTopPerformers:
          type: array
          items:
            $ref: "#/components/schemas/EmsTopPerformer"
        monthlyTopPerformers:
          type: array
          items:
            $ref: "#/components/schemas/EmsTopPerformer"
        weekPeriods:
          type: array
          items:
            type: string
      required:
        - activePersonnel
        - monthlyTotal
        - weeklyTopPerformers
        - monthlyTopPerformers
        - weekPeriods
